# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "a6ac69ec33ef3bd63db0fec6e865bfe9"
name = "pro-validation"
application_url = "https://pro-validation.onrender.com"
embedded = true

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = "write_products,write_validations,read_checkouts,read_orders,write_delivery_customizations,read_delivery_customizations,write_payment_customizations,read_payment_customizations,read_shipping"

[auth]
redirect_urls = [
  "https://pro-validation.onrender.com/api/auth",
  "https://pro-validation.onrender.com/api/auth/callback"
]

[webhooks]
api_version = "2026-10"

# NOTE: checkouts/create, checkouts/update, and orders/create are NOT listed here.
# Those topics contain Protected Customer Data and Shopify's GraphQL API returns
# 403 Forbidden when the app tries to register them automatically during OAuth.
# Register those webhooks manually in the Shopify Partner Dashboard instead.
# See: https://shopify.dev/docs/apps/build/privacy-law-compliance/protected-customer-data

[[webhooks.subscriptions]]
topics = [ "app/uninstalled" ]
uri = "/api/webhooks"

[build]
automatically_update_urls_on_dev = true
